server:
  port: 8080

spring:
  application:
    name: chun-chi-backend
  datasource:
    url: jdbc:h2:mem:chunchidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# LLM (Ollama) settings
llm:
  ollama:
    base-url: http://localhost:11434
    model: qwen3:latest
    timeout-seconds: 120

# CORS
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.chunchi: DEBUG
    org.springframework.web: INFO
