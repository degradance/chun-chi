version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: chun-chi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chun-chi-backend
    ports:
      - "8080:8080"
    environment:
      - LLM_OLLAMA_BASE_URL=http://ollama:11434
      - LLM_OLLAMA_MODEL=qwen3:latest
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chun-chi-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
